<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Test <font-face> -->
    <font-face id="test-fontface" font-family="MyFont" units-per-em="1000" ascent="800" descent="200">
      <font-face-src>
        <font-face-uri href="font.woff" />
        <font-face-name name="Arial" />
      </font-face-src>
    </font-face>

    <!-- Test <font> with new tags -->
    <font id="test-font" font-family="MyFont" horiz-adv-x="1000">
      <!-- Test <glyph> -->
      <glyph unicode="A" glyph-name="A" horiz-adv-x="700" d="M100,800 L150,200 L200,800 L300,800 L250,200 L400,800" />

      <!-- Test <missing-glyph> -->
      <missing-glyph horiz-adv-x="500" d="M50,100 L450,100 L450,400 L50,400 Z" />

      <!-- Test <hkern> -->
      <hkern g1="A" g2="V" k="-50" />
      <hkern u1="0041" u2="0056" k="-50" />

      <!-- Test <vkern> -->
      <vkern g1="A" g2="g" k="-30" />
    </font>

    <!-- Test <color-profile> -->
    <color-profile id="test-colorprofile" name="sRGB" local="sRGB" rendering-intent="perceptual" href="sRGB.icc" />
  </defs>

  <!-- Basic shapes for visual verification -->
  <rect x="50" y="50" width="100" height="100" fill="blue" />
  <circle cx="300" cy="150" r="50" fill="green" />

  <text x="50" y="300" font-family="Arial" font-size="24">Font tags parsed successfully</text>
</svg>
